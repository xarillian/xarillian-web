<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<!-- Root-relative asset paths so GitHub Pages can serve 404.html from nested URLs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=IBM+Plex+Sans&amp;display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="not-found">
  <p class="status">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <p class="home"><a href="/">Return to the home page</a></p>
</main>
</body>
</html>
